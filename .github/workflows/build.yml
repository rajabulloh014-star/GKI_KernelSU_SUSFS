name: Kernel Build Process
permissions:
  contents: write
  actions: write

on:
  workflow_call:
    inputs:
      version:
        required: true
        type: string
      android_version:
        required: true
        type: string
      kernel_version:
        required: true
        type: string
      sublevel:
        required: true
        type: string
      os_patch_level:
        required: true
        type: string
      variant:
        required: false
        type: string
      feature_set:
        required: true
        type: string
      ksu_branch:
        required: false
        type: string
        default: ""
      susfs_commit:
        required: false
        type: string
        default: ""
      root_flavor:
        required: false
        type: string
        default: ""
      root_commit:
        required: false
        type: string
        default: ""
      nomount_commit:
        required: false
        type: string
        default: ""
      kernel_patches_commit:
        required: false
        type: string
        default: ""
      anykernel3_commit:
        required: false
        type: string
        default: ""
      droidspaces_commit:
        required: false
        type: string
        default: ""
      brand_name:
        required: false
        type: string
        default: Wild
      keep_kmi:
        required: false
        type: boolean
        default: false
      allow_version_mismatch:
        required: false
        type: boolean
        default: false
      use_cache:
        description: "Enable ccache/bazel cache (restore/save via release buckets)"
        required: false
        type: boolean
        default: true
      page_size:
        description: "ARM64 page size: 4k (default) or 16k (Kleaf --page_size)"
        required: false
        type: string
        default: "4k"

jobs:
  build-gki:
    name: "${{ inputs.kernel_version }}.${{ inputs.sublevel }}-${{ inputs.android_version }}-${{ inputs.os_patch_level }} (${{ inputs.variant }})"
    runs-on: ubuntu-latest
    timeout-minutes: 120
    concurrency:
      group: build-${{ inputs.root_flavor }}-${{ inputs.android_version }}-${{ inputs.kernel_version }}.${{ inputs.sublevel }}-${{ inputs.os_patch_level }}-${{ inputs.variant }}${{ inputs.page_size }}
      cancel-in-progress: false
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v7

    - name: Validate Page Size
      shell: bash
      run: |
        set -euo pipefail
        PAGE_SIZE="${{ inputs.page_size }}"
        case "$PAGE_SIZE" in
          4k) exit 0 ;;
          16k) ;;
          *) echo "ERROR: unsupported page_size '$PAGE_SIZE' (expected 4k or 16k)." >&2; exit 1 ;;
        esac
        case "${{ inputs.version }}" in
          android14-6.1|android15-6.6|android16-6.12) ;;
          *)
            echo "ERROR: page_size=16k is not supported for ${{ inputs.version }}." >&2
            exit 1
            ;;
        esac

    - name: Emergency Disk Cleanup
      if: false
      uses: ./.github/actions/disk-cleanup

    - name: Free Disk Space
      if: true
      uses: endersonmenezes/free-disk-space@v4
      with:
        remove_android: true
        remove_dotnet: true
        remove_haskell: true
        remove_tool_cache: true
        remove_swap: true
        remove_packages: "azure-cli google-cloud-cli microsoft-edge-stable google-chrome-stable firefox postgresql* temurin-* *llvm* mysql* dotnet-sdk-*"
        remove_packages_one_command: true
        remove_folders: "/usr/share/swift /usr/share/miniconda /usr/share/az* /usr/local/lib/node_modules /usr/local/share/chromium /usr/local/share/powershell /usr/local/julia /usr/local/aws-cli /usr/local/aws-sam-cli /usr/share/gradle"
        rm_cmd: "rmz"
        rmz_version: "3.2.0"
        testing: false

    - name: Setup more Swap (for LTO)
      uses: pierotofy/set-swap-space@master
      with:
        swap-size-gb: 16

    - name: Setup Build Environment
      uses: ./.github/actions/setup-build-environment
      with:
        version: ${{ inputs.version }}
        sublevel: ${{ inputs.sublevel }}
        kernel_patches_commit: ${{ inputs.kernel_patches_commit }}
        anykernel3_commit: ${{ inputs.anykernel3_commit }}
          
    - name: Download Kernel Repository
      uses: ./.github/actions/download-kernel
      with:
        version: ${{ inputs.version }}
        android_version: ${{ inputs.android_version }}
        kernel_version: ${{ inputs.kernel_version }}
        os_patch_level: ${{ inputs.os_patch_level }}

    - name: Set Build Timestamp from Kernel Commit
      shell: bash
      run: |
        set -x
        OS_PATCH_LEVEL_INPUT="${{ inputs.os_patch_level }}"
        if [[ "$OS_PATCH_LEVEL_INPUT" == lts* ]]; then
          if [[ "$OS_PATCH_LEVEL_INPUT" =~ ^lts-([0-9]{2})$ ]]; then
            OS_PATCH_LEVEL_YM="$(date -u +%Y)-${BASH_REMATCH[1]}"
          else
            OS_PATCH_LEVEL_YM="$(date -u +%Y-%m)"
          fi
        else
          OS_PATCH_LEVEL_YM="$OS_PATCH_LEVEL_INPUT"
        fi
        FIXED_BUILD_DATE="${OS_PATCH_LEVEL_YM}-05 04:20:00 UTC"
        SOURCE_DATE_EPOCH=$(date -u -d "$FIXED_BUILD_DATE" +%s)
        echo "SOURCE_DATE_EPOCH=$SOURCE_DATE_EPOCH" >> $GITHUB_ENV
        KBUILD_TS=$(date -u -d @${SOURCE_DATE_EPOCH} '+%a %b %d %H:%M:%S UTC %Y')
        echo "KBUILD_BUILD_TIMESTAMP=${KBUILD_TS}" >> $GITHUB_ENV
        GIT_DATE=$(date -u -d @${SOURCE_DATE_EPOCH} '+%Y-%m-%dT%H:%M:%SZ')
        echo "GIT_COMMITTER_DATE=${GIT_DATE}" >> $GITHUB_ENV
        echo "GIT_AUTHOR_DATE=${GIT_DATE}" >> $GITHUB_ENV

    - name: Extract Sublevel and Set File Name
      id: extract
      uses: ./.github/actions/extract-sublevel-file-name
      with:
        android_version: ${{ inputs.android_version }}
        kernel_version: ${{ inputs.kernel_version }}
        sublevel: ${{ inputs.sublevel }}
        os_patch_level: ${{ inputs.os_patch_level }}
        variant: ${{ inputs.variant }}
        page_size: ${{ inputs.page_size }}

    - name: Kernel Fixes
      uses: ./.github/actions/kernel-fixes
      with:
        version: ${{ inputs.version }}
        android_version: ${{ inputs.android_version }}
        kernel_version: ${{ inputs.kernel_version }}
        sublevel: ${{ steps.extract.outputs.sublevel }}
        os_patch_level: ${{ inputs.os_patch_level }}

    - name: Reject KowSU with SUSFS
      if: inputs.root_flavor == 'kowsu' && (contains(inputs.feature_set, 'SUSFS') || inputs.feature_set == 'All')
      shell: bash
      run: |
        echo "ERROR: KowSU does not work together with SUSFS — re-run with SUSFS off." >&2
        exit 1

    - name: Setup Selected Root Implementation
      if: inputs.root_flavor != '' && inputs.root_flavor != 'none'
      uses: ./.github/actions/root-setup
      with:
        flavor: ${{ inputs.root_flavor }}
        commit: ${{ inputs.root_commit }}

    - name: Mark No Root build metadata
      if: inputs.root_flavor == 'none'
      shell: bash
      run: |
        {
          echo "ROOT_IMPLEMENTATION=none"
          echo "ROOT_MANAGER=N/A"
          echo "ROOT_VERSION=N/A"
          echo "ROOT_COMMIT=N/A"
        } >> "$GITHUB_ENV"

    - name: Disable SUSFS for ReSukiSU without SUSFS feature
      if: inputs.root_flavor == 'resukisu' && !contains(inputs.feature_set, 'SUSFS')
      uses: ./.github/actions/set-kernel-config
      with:
        config_list: |
          CONFIG_KSU_SUSFS=n
          CONFIG_KSU_SUSFS_SUS_PATH=n
          CONFIG_KSU_SUSFS_SUS_MOUNT=n
          CONFIG_KSU_SUSFS_SUS_KSTAT=n
          CONFIG_KSU_SUSFS_SPOOF_UNAME=n
          CONFIG_KSU_SUSFS_ENABLE_LOG=n
          CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS=n
          CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG=n
          CONFIG_KSU_SUSFS_OPEN_REDIRECT=n
          CONFIG_KSU_SUSFS_SUS_MAP=n

    - name: Disable SUSFS for SukiSU-Ultra without SUSFS feature
      if: inputs.root_flavor == 'sukisu-ultra' && !contains(inputs.feature_set, 'SUSFS')
      uses: ./.github/actions/set-kernel-config
      with:
        config_list: |
          CONFIG_KSU_SUSFS=n
          CONFIG_KSU_SUSFS_SUS_PATH=n
          CONFIG_KSU_SUSFS_SUS_MOUNT=n
          CONFIG_KSU_SUSFS_SUS_KSTAT=n
          CONFIG_KSU_SUSFS_SPOOF_UNAME=n
          CONFIG_KSU_SUSFS_ENABLE_LOG=n
          CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS=n
          CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG=n
          CONFIG_KSU_SUSFS_OPEN_REDIRECT=n
          CONFIG_KSU_SUSFS_SUS_MAP=n

    - name: Resolve SUSFS commit
      id: susfs-cm
      shell: bash
      run: |
        set -euo pipefail
        if [ "${{ inputs.root_flavor }}" = "next" ]; then
          BRANCH="gki-${{ inputs.android_version }}-${{ inputs.kernel_version }}"
          SUSFS_COMMIT="$(git ls-remote https://gitlab.com/simonpunk/susfs4ksu.git "refs/heads/${BRANCH}" | cut -f1)"
          echo "KernelSU-Next: resolving SUSFS at latest on ${BRANCH} -> ${SUSFS_COMMIT}"
        else
          SUSFS_COMMIT="${{ inputs.susfs_commit }}"
          echo "Using pinned SUSFS commit: ${SUSFS_COMMIT}"
        fi
        echo "commit=${SUSFS_COMMIT}" >> "$GITHUB_OUTPUT"

    - name: SUSFS
      if: contains(inputs.feature_set, 'SUSFS') || inputs.feature_set == 'All'
      uses: ./.github/actions/susfs
      with:
        susfs_commit: ${{ steps.susfs-cm.outputs.commit }}
        version: ${{ inputs.version }}
        android_version: ${{ inputs.android_version }}
        kernel_version: ${{ inputs.kernel_version }}
        os_patch_level: ${{ inputs.os_patch_level }}
        sublevel: ${{ steps.extract.outputs.sublevel }}
        root_flavor: ${{ inputs.root_flavor }}

    - name: Fix selinux_hide pointer-bool-conversion on 6.6+ (ALL branches)
      shell: bash
      run: |
        set -euo pipefail
        KVER="${{ inputs.kernel_version }}"
        if [ "$(printf '%s\n' "6.6" "$KVER" | sort -V | head -n1)" = "6.6" ]; then
          echo "[*] KVER $KVER >= 6.6, patching selinux_hide.c"
          for f in $(find "${{ github.workspace }}" -name selinux_hide.c 2>/dev/null); do
            if grep -q "extern void security_dump_masked_av_fn" "$f"; then
              sed -i 's/if (security_dump_masked_av_fn)/if (\&security_dump_masked_av_fn)/g' "$f"
              sed -i 's/if (security_dump_masked_av_fn != NULL)/if (\&security_dump_masked_av_fn != NULL)/g' "$f"
              sed -i 's/if (context_struct_compute_av_fn)/if (\&context_struct_compute_av_fn)/g' "$f"
              sed -i 's/if (context_struct_compute_av_fn != NULL)/if (\&context_struct_compute_av_fn != NULL)/g' "$f"
            elif grep -q "if (security_dump_masked_av_fn" "$f"; then
              sed -i 's/if (security_dump_masked_av_fn)/if (security_dump_masked_av_fn != NULL)/g' "$f"
              sed -i 's/if (context_struct_compute_av_fn)/if (context_struct_compute_av_fn != NULL)/g' "$f"
            fi
            if grep -q "^static int security_context_to_sid_with_policy" "$f"; then
              sed -i 's/^static int security_context_to_sid_with_policy/int security_context_to_sid_with_policy/g' "$f"
              sed -i 's/^static int security_sid_to_context_with_policy/int security_sid_to_context_with_policy/g' "$f"
              sed -i 's/^static void security_compute_av_user_with_policy/void security_compute_av_user_with_policy/g' "$f"
            fi
          done
        fi

    - name: Baseband Guard
      if: (contains(inputs.feature_set, 'BBG') || inputs.feature_set == 'All')
      uses: ./.github/actions/bbg

    - name: Setup Networking
      if: contains(inputs.feature_set, 'NET') || inputs.feature_set == 'All'
      uses: ./.github/actions/networking
      with:
        version: ${{ inputs.version }}
        kernel_version: ${{ inputs.kernel_version }}
        android_version: ${{ inputs.android_version }}
        sublevel: ${{ steps.extract.outputs.sublevel }}

    - name: DroidSpaces-OSS Patches
      if: contains(inputs.feature_set, 'DS') || inputs.feature_set == 'All'
      uses: ./.github/actions/droidspaces
      with:
        version: ${{ inputs.version }}
        kernel_version: ${{ inputs.kernel_version }}
        droidspaces_commit: ${{ inputs.droidspaces_commit }}

    - name: Apply NTSync Patches
      if: contains(inputs.feature_set, 'NTSync')
      uses: ./.github/actions/ntsync
      with:
        version: ${{ inputs.version }}
        kernel_version: ${{ inputs.kernel_version }}
        sublevel: ${{ steps.extract.outputs.sublevel }}

    - name: Apply Ptrace Patch
      if: contains(inputs.feature_set, 'Ptrace')
      uses: ./.github/actions/ptrace
      with:
        kernel_version: ${{ inputs.kernel_version }}

    - name: Apply Unicode Fix Patch
      if: contains(inputs.feature_set, 'Unicode')
      uses: ./.github/actions/unicode-fix
      with:
        kernel_version: ${{ inputs.kernel_version }}

    - name: Apply Performance Patches
      uses: ./.github/actions/performance
      if: contains(inputs.feature_set, 'Perf')
      with:
        kernel_version: ${{ inputs.kernel_version }}

    - name: Setup Misc Configs
      uses: ./.github/actions/misc

    - name: Enable BPF Stack (BTF + eBPF + FUSE-BPF)
      if: contains(inputs.feature_set, 'BPF')
      uses: ./.github/actions/btf
      with:
        version: ${{ inputs.version }}
        kernel_version: ${{ inputs.kernel_version }}
        sublevel: ${{ steps.extract.outputs.sublevel }}

    - name: Apply Device-Specific Patches
      uses: ./.github/actions/apply-device-patches
      with:
        version: ${{ inputs.version }}
        kernel_version: ${{ inputs.kernel_version }}

    - name: Integrate NoMount
      if: contains(inputs.feature_set, 'NoMount') || inputs.feature_set == 'All'
      uses: ./.github/actions/nomount
      with:
        commit: ${{ inputs.nomount_commit }}
        kernel_version: ${{ inputs.kernel_version }}

    # =========================================================================
    # Re:Kernel — Tombstone Kernel Support
    # =========================================================================
    - name: Apply Re:Kernel
      if: contains(inputs.feature_set, 'ReKernel') || inputs.feature_set == 'All'
      shell: bash
      run: |
        set -euo pipefail

        WORKSPACE="${{ github.workspace }}"
        if [ -d "$WORKSPACE/kernel/common" ]; then
          KERNEL_SRC="$WORKSPACE/kernel/common"
        else
          KERNEL_SRC="$WORKSPACE/kernel"
        fi

        echo "==============================================="
        echo "[*] Menginstall dependensi Re:Kernel..."
        echo "==============================================="
        sudo apt-get update -qq
        sudo apt-get install -y -qq aria2 wget tar

        # --- Install Coccinelle versi baru dari GitHub releases ---
        echo "[*] Menginstall Coccinelle versi baru dari GitHub releases..."
        COCCI_VERSION="1.3"
        COCCI_TARBALL="coccinelle-${COCCI_VERSION}-bin-x86_64.tar.gz"
        COCCI_URL="https://github.com/coccinelle/coccinelle/releases/download/${COCCI_VERSION}/${COCCI_TARBALL}"

        cd /tmp
        if wget -q "$COCCI_URL" -O "$COCCI_TARBALL"; then
          tar -xzf "$COCCI_TARBALL"
          COCCI_DIR=$(find /tmp -maxdepth 1 -type d -name "coccinelle-*" | head -1)
          if [ -n "$COCCI_DIR" ]; then
            sudo cp -a "$COCCI_DIR" /opt/coccinelle
            sudo ln -sf /opt/coccinelle/bin/spatch /usr/local/bin/spatch
            echo "[+] Coccinelle terinstall:"
            spatch --version 2>&1 | head -3 || true
          else
            echo "[!] Fallback ke apt coccinelle..."
            sudo apt-get install -y -qq coccinelle
          fi
        else
          echo "[!] Gagal download, fallback ke apt coccinelle..."
          sudo apt-get install -y -qq coccinelle
        fi

        echo "==============================================="
        echo "[*] Mengunduh source dan patch Re:Kernel..."
        echo "==============================================="
        TEMP_DIR="/tmp/rekernel-patch"
        rm -rf "$TEMP_DIR"
        mkdir -p "$TEMP_DIR/cocci"

        REPO_BASE="https://github.com/dabao1955/kernel_build_action/raw/main/rekernel"
        PATCHES_BASE="https://raw.githubusercontent.com/dabao1955/kernel_build_action/main/rekernel/patches"

        aria2c -d "$TEMP_DIR" -o src.zip "$REPO_BASE/src.zip"
        aria2c -d "$TEMP_DIR/cocci" "$PATCHES_BASE/proc_ops.cocci"
        aria2c -d "$TEMP_DIR/cocci" "$PATCHES_BASE/binder.cocci"
        aria2c -d "$TEMP_DIR/cocci" "$PATCHES_BASE/signal.cocci"

        echo "[*] Mengekstrak source..."
        unzip -o "$TEMP_DIR/src.zip" -d "$TEMP_DIR"

        REKERNEL_DST="$KERNEL_SRC/drivers/rekernel"
        rm -rf "$REKERNEL_DST"
        cp -r "$TEMP_DIR/rekernel" "$REKERNEL_DST"
        echo "[+] Re:Kernel source disalin ke $REKERNEL_DST"

        echo "[*] Menerapkan patch Coccinelle..."

        SPATCH_OK=0
        if command -v spatch >/dev/null 2>&1; then
          echo "[*] spatch ditemukan: $(spatch --version 2>&1 | head -1)"
          SPATCH_OK=1
        fi

        if [ "$SPATCH_OK" -eq 1 ]; then
          # Patch 1: proc_ops (hanya jika kernel pakai struct proc_ops)
          if grep -q "struct proc_ops" "$KERNEL_SRC/include/linux/proc_fs.h" 2>/dev/null; then
            echo "[*] Menerapkan proc_ops.cocci ke rekernel.c..."
            if spatch --in-place --sp-file "$TEMP_DIR/cocci/proc_ops.cocci" "$REKERNEL_DST/rekernel.c" 2>&1; then
              echo "[+] proc_ops patch OK"
            else
              echo "[!] proc_ops patch gagal"
            fi
          else
            echo "[*] Kernel tidak pakai struct proc_ops, skip proc_ops patch"
          fi

          # Patch 2: binder.cocci
          if [ -f "$KERNEL_SRC/drivers/android/binder.c" ]; then
            echo "[*] Menerapkan binder.cocci ke binder.c..."
            if spatch --in-place --sp-file "$TEMP_DIR/cocci/binder.cocci" "$KERNEL_SRC/drivers/android/binder.c" 2>&1; then
              echo "[+] binder patch OK"
            else
              echo "[!] binder patch gagal — coba dengan --no-includes"
              spatch --no-includes --in-place --sp-file "$TEMP_DIR/cocci/binder.cocci" "$KERNEL_SRC/drivers/android/binder.c" 2>&1 || true
            fi
          else
            echo "[!] binder.c tidak ditemukan"
          fi

          # Patch 3: signal.cocci
          if [ -f "$KERNEL_SRC/kernel/signal.c" ]; then
            echo "[*] Menerapkan signal.cocci ke signal.c..."
            if spatch --in-place --sp-file "$TEMP_DIR/cocci/signal.cocci" "$KERNEL_SRC/kernel/signal.c" 2>&1; then
              echo "[+] signal patch OK"
            else
              echo "[!] signal patch gagal — coba dengan --no-includes"
              spatch --no-includes --in-place --sp-file "$TEMP_DIR/cocci/signal.cocci" "$KERNEL_SRC/kernel/signal.c" 2>&1 || true
            fi
          else
            echo "[!] signal.c tidak ditemukan"
          fi
        else
          echo "[!] spatch tidak tersedia, skip semua patch Coccinelle"
        fi

        echo "[*] Menambahkan konfigurasi ke defconfig dan fragment..."
        FRAGMENT="$WORKSPACE/wild_gki.fragment"
        {
          echo ""
          echo "# === Re:Kernel configs ==="
          echo "CONFIG_REKERNEL=y"
          echo "CONFIG_REKERNEL_NETWORK=n"
          echo "# === End Re:Kernel configs ==="
        } >> "$FRAGMENT"

        KCONFIG="$KERNEL_SRC/drivers/Kconfig"
        if ! grep -q 'source "drivers/rekernel/Kconfig"' "$KCONFIG" 2>/dev/null; then
          awk '/^endmenu$/{last=NR} {lines[NR]=$0} END{for(i=1;i<=NR;i++){if(i==last) print "source \"drivers/rekernel/Kconfig\""; print lines[i]}}' "$KCONFIG" > "$KCONFIG.tmp" && mv "$KCONFIG.tmp" "$KCONFIG"
          echo "[+] drivers/Kconfig diperbarui"
        fi

        MAKEFILE="$KERNEL_SRC/drivers/Makefile"
        if ! grep -q "obj-\$(CONFIG_REKERNEL) += rekernel/" "$MAKEFILE" 2>/dev/null; then
          echo "" >> "$MAKEFILE"
          echo "obj-\$(CONFIG_REKERNEL) += rekernel/" >> "$MAKEFILE"
          echo "[+] drivers/Makefile diperbarui"
        fi

        echo "[+] Re:Kernel berhasil diintegrasikan."

    # =========================================================================
    # Kali NetHunter — Core Patches
    # =========================================================================
    - name: Apply Kali NetHunter Kernel Patches
      if: contains(inputs.feature_set, 'NET') || inputs.feature_set == 'All'
      shell: bash
      run: |
        set -euo pipefail

        KVER="${{ inputs.kernel_version }}"
        WORKSPACE="${{ github.workspace }}"

        if [ -d "$WORKSPACE/kernel/common" ]; then
          KERNEL_SRC="$WORKSPACE/kernel/common"
        elif [ -d "$WORKSPACE/kernel" ]; then
          KERNEL_SRC="$WORKSPACE/kernel"
        else
          echo "[-] Tidak menemukan source kernel di $WORKSPACE/kernel"
          exit 0
        fi
        echo "[*] KERNEL_SRC = $KERNEL_SRC"

        NH_REPO="/tmp/nethunter-patches"
        rm -rf "$NH_REPO"
        git clone --depth=1 \
          https://github.com/wumingzhinu/kali-nethunter-kernel-patches.git \
          "$NH_REPO"

        case "$KVER" in
          4.4|4.9|4.14|4.19|5.4) PATCH_DIR="patches/${KVER}" ;;
          5.10|5.15|6.1|6.6|6.12) PATCH_DIR="adapted/${KVER}" ;;
          *) echo "[-] Kernel $KVER belum didukung. Skip."; exit 0 ;;
        esac

        PATCH_PATH="$NH_REPO/$PATCH_DIR"
        if [ ! -d "$PATCH_PATH" ]; then
          echo "[-] Direktori $PATCH_PATH tidak ada. Skip."
          exit 0
        fi

        echo "[*] Menggunakan patch dari: $PATCH_DIR"
        ls -la "$PATCH_PATH" || true

        mkdir -p "$WORKSPACE/patch-rejects"
        FAILED=0
        APPLIED=0
        for patch in "$PATCH_PATH"/*.patch; do
          [ -e "$patch" ] || continue
          echo "==============================================="
          echo "[*] Applying: $(basename "$patch")"
          if git -C "$KERNEL_SRC" apply --whitespace=nowarn "$patch"; then
            echo "[+] OK"
            APPLIED=$((APPLIED + 1))
          else
            echo "[!] Konflik pada $(basename "$patch")"
            git -C "$KERNEL_SRC" apply --reject --whitespace=nowarn "$patch" || true
            cp "$patch" "$WORKSPACE/patch-rejects/" 2>/dev/null || true
            FAILED=$((FAILED + 1))
          fi
        done

        echo "[*] Ringkasan: $APPLIED patch berhasil, $FAILED patch gagal."

        NH_CONFIG="$NH_REPO/config/GKI-nethunter.config"
        FRAGMENT="$WORKSPACE/wild_gki.fragment"
        if [ -f "$NH_CONFIG" ]; then
          echo "[*] Menambahkan config NetHunter ke $FRAGMENT"
          {
            echo ""
            echo "# === Kali NetHunter configs (upstream) ==="
            cat "$NH_CONFIG"
            echo "# === End Kali NetHunter configs (upstream) ==="
          } >> "$FRAGMENT"
        fi

        echo "[+] Kali NetHunter patch step selesai."

    # =========================================================================
    # Kali NetHunter — Full Feature Configs
    # =========================================================================
    - name: Apply NetHunter Full Feature Configs
      if: contains(inputs.feature_set, 'NET') || inputs.feature_set == 'All'
      shell: bash
      run: |
        set -euo pipefail

        FRAGMENT="${{ github.workspace }}/wild_gki.fragment"

        cat >> "$FRAGMENT" << 'NETCONFIG'

        # =====================================================================
        # Kali NetHunter — Full Feature Configs (auto-generated, in-tree only)
        # =====================================================================

        # --- Wi-Fi Injection & Monitor Mode ---
        CONFIG_CFG80211=y
        CONFIG_MAC80211=y
        CONFIG_MAC80211_MESH=y
        CONFIG_WIRELESS=y
        CONFIG_WLAN=y
        CONFIG_RFKILL=y
        CONFIG_RFKILL_INPUT=y
        CONFIG_CFG80211_WEXT=y

        # --- USB HID (BadUSB) ---
        CONFIG_USB_HID=y
        CONFIG_HID_GENERIC=y
        CONFIG_HIDRAW=y
        CONFIG_HID_LOGITECH=y
        CONFIG_HID_LOGITECH_DJ=y
        CONFIG_HID_MICROSOFT=y
        CONFIG_HID_APPLE=y
