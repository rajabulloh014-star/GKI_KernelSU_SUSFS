    - name: Verify NetHunter Features
      if: contains(inputs.feature_set, 'NET') || inputs.feature_set == 'All'
      shell: bash
      run: |
        set -euo pipefail
        FRAGMENT="${{ github.workspace }}/wild_gki.fragment"

        echo "==============================================="
        echo "[*] Verifikasi config NetHunter (in-tree):"
        echo "==============================================="

        check_config() {
          local cfg="$1"
          if grep -q "^${cfg}=" "$FRAGMENT" 2>/dev/null; then
            echo "  [+] $cfg"
          else
            echo "  [-] $cfg"
          fi
        }

        echo "--- Wi-Fi Injection ---"
        check_config "CONFIG_CFG80211"
        check_config "CONFIG_MAC80211"
        echo "--- USB HID ---"
        check_config "CONFIG_USB_CONFIGFS_F_HID"
        check_config "CONFIG_HIDRAW"
        echo "--- Bluetooth RFCOMM ---"
